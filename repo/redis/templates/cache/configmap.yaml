apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cache-config
  namespace: {{ .Release.Namespace }}
data:
  CACHE_CONFIG: |
    bind 0.0.0.0
    port 6379

    protected-mode no

    dir /data
    dbfilename dump.rdb

    appendonly no

    timeout 0
    tcp-keepalive 300

    daemonize no
    supervised no

    maxmemory {{ .Values.cache.maxmemory }}
    maxmemory-policy allkeys-lru
