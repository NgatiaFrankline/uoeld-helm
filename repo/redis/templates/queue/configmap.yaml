apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-queue-config
  namespace: {{ .Release.Namespace }}
data:
  QUEUE_CONFIG: |
    bind 0.0.0.0
    port 6379

    protected-mode no

    dir "/data"
    dbfilename "dump.rdb"

    appendonly yes
    appendfsync everysec

    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aof-load-truncated yes

    timeout 0
    tcp-keepalive 300

    daemonize no
    supervised no

    maxmemory {{ .Values.queue.maxmemory }}
    maxmemory-policy noeviction