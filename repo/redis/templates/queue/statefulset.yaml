apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-queue-sts
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: redis-queue-headless-svc
  replicas: 1
  selector:
    matchLabels:
      app: redis-queue-app
  template:
    metadata:
      labels:
        app: redis-queue-app
    spec:
{{ include "x.image.pull.secrets.manifest" . | indent 6 }}
      nodeSelector:
        {{ .Values.nodeSelector.selectorKey }}: {{ .Values.nodeSelector.selectorValue }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - redis-queue-app
              topologyKey: kubernetes.io/hostname
      containers:
        - name: redis-queue
          image: {{ .Values.image }}
          imagePullPolicy: Always
          ports:
            - name: client
              containerPort: 6379
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_VOLUME_DIR_PREFIX
              value: "$(NAMESPACE)-$(MY_POD_NAME)"
            - name: THIS_NODE_NAME
              value: "$(MY_POD_NAME).redis-queue-headless-svc.$(NAMESPACE).svc.cluster.local"
            - name: NODE_ROLE
              value: redis
            - name: DATA_LAYER
              value: queue
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -h localhost -p 6379 ping | grep -q PONG
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -h localhost -p 6379 ping | grep -q PONG
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
              subPathExpr: $(REDIS_VOLUME_DIR_PREFIX)
            - name: queue-config
              mountPath: /conf/queue-redis.conf
              subPath: queue-redis.conf
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.storage.hostPath }}
            type: DirectoryOrCreate
        - name: queue-config
          configMap:
            name: redis-queue-config
            items:
              - key: QUEUE_CONFIG
                path: queue-redis.conf
