apiVersion: v1
kind: Service
metadata:
  name: redis-queue-headless-svc
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  ports:
    - name: client
      port: {{ .Values.queue.port }}
      targetPort: client
      protocol: TCP
  selector:
    app: redis-queue-app
---
apiVersion: v1
kind: Service
metadata:
  name: redis-queue-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: client
      port: {{ .Values.queue.port }}
      targetPort: client
      protocol: TCP
  selector:
    app: redis-queue-app
