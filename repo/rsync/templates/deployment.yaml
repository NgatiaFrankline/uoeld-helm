{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsync-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: rsync-app
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: rsync-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rsync-app
    spec:
{{ include "x.image.pull.secrets.manifest" . | indent 6 }}
      nodeSelector:
        {{ .Values.nodeSelector.selectorKey }}: {{ .Values.nodeSelector.selectorValue }}
      restartPolicy: Always
      containers:
        - name: rsync
          image: "{{ .Values.image }}"
          imagePullPolicy: Always
          resources:
{{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: BUILD_ENV
              value: "k8s"
            - name: RSYNC_REMOTE_USER
              value: {{ .Values.env.remoteUser | quote }}
            - name: RSYNC_REMOTE_HOST_ADDRESS
              value: {{ .Values.env.remoteHost | quote }}
            - name: RSYNC_REMOTE_HOST_PORT
              value: {{ .Values.env.remotePort | quote }}
            - name: RSYNC_REMOTE_DIR
              value: {{ .Values.env.remoteDir | quote }}
            - name: RSYNC_LOCAL_DIR
              value: {{ .Values.env.localDir | quote }}
            - name: RSYNC_CRON_TIME
              value: {{ .Values.env.cronTime | quote }}
          volumeMounts:
            - name: rsync-config
              mountPath: /tmp/rsync-config/rsync_exclude.txt
              subPath: rsync_exclude.txt
            - name: backup-drive
              mountPath: /data/backup
            - name: ssh-drive
              mountPath: /root/.ssh
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -x crond > /dev/null || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -x crond > /dev/null || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: rsync-config
          configMap:
            name: rsync-config
            items:
              - key: RSYNC_EXCLUDE
                path: rsync_exclude.txt
        - name: ssh-drive
          persistentVolumeClaim:
            claimName: {{ .Release.Namespace }}-rsync-ssh-pvc
        - name: backup-drive
{{- include "x.backup.volume.source" . | indent 10 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rsync-config
  namespace: {{ .Release.Namespace }}
data:
  RSYNC_EXCLUDE: |
{{ .Values.rsyncExclude | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Namespace }}-rsync-ssh-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Mi
  storageClassName: ceph-filesystem
  volumeMode: Filesystem
  {{ if .Values.storage.rsyncSshPV -}}
  volumeName: {{ .Values.storage.rsyncSshPV }}
  {{- end }}