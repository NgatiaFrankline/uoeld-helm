apiVersion: v1
kind: Service
metadata:
  name: wordpress-nodeport-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      nodePort: 30095
  selector:
    app: wordpress-drupal
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: wordpress-drupal
