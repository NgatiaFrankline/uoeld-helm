apiVersion: apps/v1
kind: Deployment
metadata:
  name: galera-proxysql-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: galera-proxysql-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: galera-proxysql-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: galera-proxysql-app
    spec:
{{ include "x.image.pull.secrets.manifest" . | indent 6 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node1 }}
                      - {{ .Values.nodeSelectors.node2 }}
                      - {{ .Values.nodeSelectors.node3 }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node1 }}
            - weight: 30
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node2 }}
            - weight: 20
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node3 }}
        # pods with the label app:galeracluster should not be co-located on the same node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - galera-proxysql-app
              topologyKey: "kubernetes.io/hostname"  # One pod per node
      containers:
        - name: proxysql
          image: {{ .Values.image.proxysql }}
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: galera-proxysql-config
            - secretRef:
                name: galera-proxysql-secret
          ports:
            - name: client
              containerPort: 6033
              protocol: TCP
            - name: admin
              containerPort: 6032
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - mysql -h127.0.0.1 -P6032 -u${ADMIN_USER} -p${ADMIN_PASSWORD} -e 'SELECT 1' 2>/dev/null || exit 1
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - mysql -h127.0.0.1 -P6032 -u${ADMIN_USER} -p${ADMIN_PASSWORD} -e 'SELECT 1' 2>/dev/null || exit 1
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: proxysql-config
              mountPath: /conf/proxysql.cnf.template
              subPath: proxysql.cnf.template
      volumes:
        - name: proxysql-config
          configMap:
            name: proxysql-config
            items:
              - key: PROXYSQL_CNF
                path: proxysql.cnf.template
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: galera-proxysql-config
  namespace: {{ .Release.Namespace }}
data:
  SQL_SERVERS: >-
    galera-sts-0.galera-headless-svc.{{ .Release.Namespace }}.svc.cluster.local:3306:rw,
    galera-sts-1.galera-headless-svc.{{ .Release.Namespace }}.svc.cluster.local:3306:r,
    galera-sts-2.galera-headless-svc.{{ .Release.Namespace }}.svc.cluster.local:3306:r
---
apiVersion: v1
kind: Secret
metadata:
  name: galera-proxysql-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ADMIN_USER: "admin"
  MONITOR_USER: "root"
  MARIADB_SERVER_VERSION: {{ .Values.secrets.db.MARIADB_SERVER_VERSION | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.db.MARIADB_ROOT_PASSWORD | quote }}
  MARIADB_ROOT_PASSWORD: {{ .Values.secrets.db.MARIADB_ROOT_PASSWORD | quote }}
  MONITOR_PASSWORD: {{ .Values.secrets.db.MARIADB_ROOT_PASSWORD | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.proxysql.ADMIN_PASSWORD | quote }}
  SQL_USERS: {{ .Values.secrets.proxysql.SQL_USERS | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: galera-proxysql-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: galera-proxysql-app
spec:
  selector:
    app: galera-proxysql-app
  type: ClusterIP
  ports:
    - name: client
      port: 6033
      targetPort: client
      protocol: TCP
    - name: admin
      port: 6032
      targetPort: admin
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: galera-proxysql-nodeport
  namespace: {{ .Release.Namespace }}
  labels:
    app: galera-proxysql-app
spec:
  selector:
    app: galera-proxysql-app
  type: NodePort
  ports:
    - name: client
      port: 6033
      targetPort: client
      nodePort: {{ .Values.services.proxysql.clientNodePort }}  # must be between 30000–32767
      protocol: TCP
    - name: admin
      port: 6032
      targetPort: admin
      nodePort: {{ .Values.services.proxysql.adminNodePort }}  # must be between 30000–32767
      protocol: TCP
