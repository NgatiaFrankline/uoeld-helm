apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: galera-sts
  namespace: {{ .Release.Namespace }}
  labels:
    app: galera-cluster-app
spec:
  serviceName: galera-headless-svc
  replicas: 3
  selector:
    matchLabels:
      app: galera-cluster-app
  template:
    metadata:
      labels:
        app: galera-cluster-app
    spec:
{{ include "x.image.pull.secrets.manifest" . | indent 6 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node1 }}
                      - {{ .Values.nodeSelectors.node2 }}
                      - {{ .Values.nodeSelectors.node3 }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node1 }}
            - weight: 30
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node2 }}
            - weight: 20
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node3 }}
        # pods with the label app:galeracluster should not be co-located on the same node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - galera-cluster-app
              topologyKey: "kubernetes.io/hostname"  # One pod per node
      containers:
        - name: galera-node
          image: {{ .Values.image.galera }}
          imagePullPolicy: Always
          env:
            - name: BUILD_ENV
              value: "k8s"
            - name: MY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GALERA_VOLUME_DIR_PREFIX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GALERA_CLUSTER_INITIATOR_NODE_NAME
              value: "galera-sts-0.galera-headless-svc.$(MY_NAMESPACE).svc.cluster.local"
            - name: THIS_GALERA_CLUSTER_NODE_NAME
              value: "$(MY_POD_NAME).galera-headless-svc.$(MY_NAMESPACE).svc.cluster.local"
            - name: BACKUP_DB_URL
              value: /backup/db-backup
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: MARIADB_INITDB_SKIP_TZINFO
              value: "1"
          envFrom:
            - secretRef:
                name: galera-secret
            - configMapRef:
                name: galera-config
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
            - name: replication
              containerPort: 4567
              protocol: TCP
            - name: state-transfer
              containerPort: 4568
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - mariadb -uroot -p$MARIADB_ROOT_PASSWORD -e 'SELECT 1;'  || exit 1
            initialDelaySeconds: 100
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - mariadb -uroot -p$MARIADB_ROOT_PASSWORD -e 'SELECT 1;'  || exit 1
            initialDelaySeconds: 100
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: mariadb-config
              mountPath: /conf/character_set.conf
              subPath: character_set.conf
            - name: mariadb-config
              mountPath: /conf/galera.conf
              subPath: galera.conf
            - name: galera-hostpath-mariadb
              mountPath: /var/lib/mysql
              subPathExpr: $(GALERA_VOLUME_DIR_PREFIX)
            - name: galera-hostpath-backup
              mountPath: /backup
              subPathExpr: $(GALERA_VOLUME_DIR_PREFIX)
      volumes:
        - name: mariadb-config
          configMap:
            name: mariadb-config
            items:
              - key: CHARACTER_SET
                path: character_set.conf
              - key: GALERA_CONF
                path: galera.conf
        - name: galera-hostpath-mariadb
          hostPath:
            path: {{ .Values.volumes.mariadbHostPath }}
            type: DirectoryOrCreate
        - name: galera-hostpath-backup
          hostPath:
            path: {{ .Values.volumes.backupHostPath }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: galera-config
  namespace: {{ .Release.Namespace }}
data:
  GALERA_NODES_HOSTS: >-
    galera-sts-0.galera-headless-svc.{{ .Release.Namespace }}.svc.cluster.local,\
    galera-sts-1.galera-headless-svc.{{ .Release.Namespace }}.svc.cluster.local,\
    galera-sts-2.galera-headless-svc.{{ .Release.Namespace }}.svc.cluster.local
---
apiVersion: v1
kind: Secret
metadata:
  name: galera-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: {{ .Values.secrets.db.MARIADB_ROOT_PASSWORD | quote }}
  MARIADB_DATABASE: {{ .Values.secrets.db.MARIADB_DATABASE | quote }}
  MARIADB_USER: {{ .Values.secrets.db.MARIADB_USER | quote }}
  MARIADB_PASSWORD: {{ .Values.secrets.db.MARIADB_PASSWORD | quote }}
  INIT_CREATE_DB_AND_USER: {{ .Values.secrets.db.INIT_CREATE_DB_AND_USER | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: galera-headless-svc
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
    - name: replication
      port: 4567
      protocol: TCP
    - name: state-transfer
      port: 4568
      protocol: TCP
  selector:
    app: galera-cluster-app
---
apiVersion: v1
kind: Service
metadata:
  name: galera-nodeport
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  ports:
    - name: client-nodeport
      port: 3306
      targetPort: mysql
      protocol: TCP
      nodePort: {{ .Values.services.galera.clientNodePort }}
  selector:
    app: galera-cluster-app
