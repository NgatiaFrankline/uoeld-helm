apiVersion: v1
kind: Secret
metadata:
  name: erp-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DB_HOST: {{ .Values.secrets.DB_HOST | quote }}
  DB_PORT: {{ .Values.secrets.DB_PORT | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.MYSQL_ROOT_PASSWORD | quote }}
  MARIADB_ROOT_PASSWORD: {{ .Values.secrets.MARIADB_ROOT_PASSWORD | quote }}
  DB_ROOT_USER: {{ .Values.secrets.DB_ROOT_USER | quote }}
  DB_ROOT_PASSWORD: {{ .Values.secrets.DB_ROOT_PASSWORD | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.ADMIN_PASSWORD | quote }}
  SITE_DB_PASSWORD: {{ .Values.secrets.SITE_DB_PASSWORD | quote }}
