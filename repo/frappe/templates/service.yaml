apiVersion: v1
kind: Service
metadata:
  name: erp-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: erp
      port: 8080
      targetPort: erp
      protocol: TCP
    - name: backend
      port: 8000
      targetPort: backend
      protocol: TCP
    - name: socketio
      port: 9000
      targetPort: socketio
      protocol: TCP
  selector:
    app: erp-app
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: erp
      port: 80
      targetPort: erp
      protocol: TCP
  selector:
    app: erp-app
