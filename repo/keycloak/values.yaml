image: docker.io/uoewebmaster/uoeerp:keycloak-v26
runCopyContainer: false
addImagePullSecretsManifest: true
hostUrl: localhost
nodeSelector:
  selectorKey: keycloak
  selectorValue: scheduled
replicas: 1
resources:
  limits:
    cpu: "1"
    memory: 1Gi
pvc:
  drive:
    pvClaimName: ""
    storageSize: 1Gi
secret:
  KC_DB: "postgres"
  KC_DB_URL_HOST: "repmgr-sts-0.repmgr-headless-svc.repmgr.svc.cluster.local" # Dont use pgpool
  KC_DB_URL_PORT: "5434"
  KC_DB_URL_DATABASE: "keycloak"
  KC_DB_USERNAME: "keycloak"
  KC_DB_PASSWORD: "keycloakpass"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin123"
