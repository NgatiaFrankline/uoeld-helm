apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: keycloak-app
  ports:
    - name: jgroups
      port: 7800
      targetPort: 7800
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: keycloak-app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
