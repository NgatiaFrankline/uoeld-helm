apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Namespace }}-drive-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.pvc.drive.storageSize }}
  storageClassName: ceph-filesystem
  volumeMode: Filesystem
  {{ if .Values.pvc.drive.pvClaimName -}}
  volumeName: {{ .Values.pvc.drive.pvClaimName }}
  {{- end }}