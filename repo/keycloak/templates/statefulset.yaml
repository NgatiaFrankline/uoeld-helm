apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-sts
  namespace: {{ .Release.Namespace }}
  labels:
    app: keycloak-app
spec:
  replicas: {{ .Values.replicas }}
  serviceName: keycloak-headless
  selector:
    matchLabels:
      app: keycloak-app
  template:
    metadata:
      labels:
        app: keycloak-app
    spec:
{{ include "x.image.pull.secrets.manifest" . | indent 6 }}
      serviceAccountName: keycloak-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        {{ .Values.nodeSelector.selectorKey }}: {{ .Values.nodeSelector.selectorValue }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - keycloak-app
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: copy-config
          image: "{{ .Values.image }}"
          command:
            - bash
            - -c
            - |
              THEME_SOURCE="/keycloak-data/themes/uoeld"
              THEME_DEST="/opt/keycloak/themes/"
              if [ -d "$THEME_SOURCE" ]; then
                echo "Copying theme from $THEME_SOURCE to $THEME_DEST"
                mkdir -p "$THEME_DEST"
                cp -rvf "$THEME_SOURCE" "$THEME_DEST"
                echo "Theme copied successfully"
              else
                echo "Theme source not found: $THEME_SOURCE"
              fi
          volumeMounts:
            - name: uoeld-theme
              mountPath: /opt/keycloak/themes/uoeld
            - name: keycloak-drive
              mountPath: /keycloak-data
      containers:
        {{ if .Values.runCopyContainer -}}
        - name: copy
          image: busybox:1.36
          command: [ "/bin/sh" ]
          args: [ "-c", "sleep infinity" ]
          volumeMounts:
            - name: keycloak-drive
              mountPath: /keycloak-data
        {{- end }}
        - name: keycloak
          image: "{{ .Values.image }}"
          imagePullPolicy: Always
          args:
            - start
{{/*          resources:*/}}
{{/*            requests:*/}}
{{/*              cpu: "250m"*/}}
{{/*              memory: "512Mi"*/}}
{{/*            limits:*/}}
{{/*              cpu: "2"*/}}
{{/*              memory: "4Gi"*/}}
          volumeMounts:
            - name: uoeld-theme
              mountPath: /opt/keycloak/themes/uoeld
            - name: keycloak-drive
              mountPath: /keycloak-data
            - name: keycloak-tls
              mountPath: /opt/keycloak/conf
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: jgroups
              containerPort: 7800
              protocol: TCP
            - name: stats
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-secret
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - curl -sfk https://localhost:9000/health/ready || exit 1
            failureThreshold: 10
            initialDelaySeconds: 120
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - curl -sfk https://localhost:9000/health/ready || exit 1
            failureThreshold: 6
            initialDelaySeconds: 240
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 10
      restartPolicy: Always
      volumes:
        - name: uoeld-theme
          emptyDir: {}
        - name: keycloak-drive
          persistentVolumeClaim:
            claimName: {{ .Release.Namespace }}-drive-pvc
        - name: keycloak-tls
          secret:
            secretName: keycloak-tls-secret
            items:
              - key: SERVER_CRT
                path: server.crt
              - key: SERVER_KEY
                path: server.key
