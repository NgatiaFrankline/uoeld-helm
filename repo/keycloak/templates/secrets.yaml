apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  KC_DB: {{ .Values.secret.KC_DB | quote }}
  KC_DB_URL_HOST: {{ .Values.secret.KC_DB_URL_HOST | quote }}
  KC_DB_URL_PORT: {{ .Values.secret.KC_DB_URL_PORT | quote }}
  KC_DB_URL_DATABASE: {{ .Values.secret.KC_DB_URL_DATABASE | quote }}
  KC_DB_USERNAME: {{ .Values.secret.KC_DB_USERNAME | quote }}
  KC_DB_PASSWORD: {{ .Values.secret.KC_DB_PASSWORD | quote }}
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.secret.KEYCLOAK_ADMIN | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secret.KEYCLOAK_ADMIN_PASSWORD | quote }}
---
