{{- range $index, $item := .Values.hosts }}
{{- if $index }}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .issuerPrefix }}-issuer
  namespace: {{ $.Release.Namespace }}
spec:
  acme:
    {{- $acmeServer := $.Values.acme.liveServer }}
    {{- if $.Values.acme.staging }}
    {{- $acmeServer = $.Values.acme.stagingServer }}
    {{- end }}
    server: {{ $acmeServer }}
    email: {{ $.Values.acme.email }}
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: {{ .issuerPrefix }}-private-key
    # Enable the HTTP-01 challenge provider
    solvers:
      - http01:
          ingress:
            class: nginx
{{- end }}