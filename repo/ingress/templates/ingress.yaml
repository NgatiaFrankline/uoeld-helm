{{- range $index, $item := .Values.hosts }}
{{- if $index }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .ingressName | quote }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    nginx.org/redirect-to-https: "true"
    nginx.org/client-max-body-size: "100m"
    nginx.org/proxy-read-timeout: "3600"
    nginx.org/proxy-send-timeout: "3600"
    nginx.org/websocket-services: {{ .backendService | quote }}
    cert-manager.io/issuer: {{ printf "%s-issuer" .issuerPrefix | quote }}
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .domain | quote }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: {{ .backendService | quote }}
                port:
                  number: {{ .backendPort }}
  tls:
    - hosts:
        - {{ .domain | quote }}
      secretName: {{ printf "%s-tls" .domain | quote }}
{{- end }}