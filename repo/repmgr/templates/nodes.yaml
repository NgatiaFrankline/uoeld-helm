apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: repmgr-sts
  namespace: {{ .Release.Namespace }}
  labels:
    app: repmgr-app
spec:
  serviceName: repmgr-headless-svc
  replicas: 3
  selector:
    matchLabels:
      app: repmgr-app
  template:
    metadata:
      labels:
        app: repmgr-app
    spec:
{{ include "x.image.pull.secrets.manifest" . | indent 6 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node1 }}
                      - {{ .Values.nodeSelectors.node2 }}
                      - {{ .Values.nodeSelectors.node3 }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node1 }}
            - weight: 30
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node2 }}
            - weight: 20
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node3 }}
        # pods with the label app:repmgr-app should not be co-located on the same node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - repmgr-app
              topologyKey: "kubernetes.io/hostname"  # One pod per node
      containers:
        - name: repmgr
          image: {{ .Values.image.repmgr }}
          imagePullPolicy: Always
          volumeMounts:
            - name: repmgr-storage
              mountPath: /var/lib/postgresql/data
              subPathExpr: $(REPMGR_VOLUME_DIR_PREFIX)
            - name: repmgr-backup
              mountPath: /backup
              subPathExpr: $(REPMGR_VOLUME_DIR_PREFIX)
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: BUILD_ENV
              value: "kubernetes"
            - name: PGHBA_HOST_ADDRESS
              value: {{ .Values.postgres_PGHBA_HOST_ADDRESS | quote }}
            - name: PGDATA
              value: "/var/lib/postgresql/data"
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REPMGR_VOLUME_DIR_PREFIX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REPMGR_NODE_NAME
              value: "$(MY_POD_NAME).repmgr-headless-svc.$(MY_NAMESPACE).svc.cluster.local"
            - name: REPMGR_PRIMARY_HOST
              value: "repmgr-sts-0.repmgr-headless-svc.$(MY_NAMESPACE).svc.cluster.local"
          envFrom:
            - secretRef:
                name: repmgr-secret
            - configMapRef:
                name: repmgr-config
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /usr/bin/pg_isready
            initialDelaySeconds: 70
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /usr/bin/pg_isready
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
      volumes:
        - name: repmgr-storage
          hostPath:
            path: {{ .Values.volumes.repmgrHostStoragePath }}
            type: DirectoryOrCreate
        - name: repmgr-backup
          hostPath:
            path: {{ .Values.volumes.repmgrHostBackupPath }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repmgr-config
  namespace: {{ .Release.Namespace }}
data:
  BUILD_ENV: "K8S"
  PGDATA: "/var/lib/postgresql/data"
  REPMGR_PARTNER_NODES: >-
    repmgr-sts-0.repmgr-headless-svc.{{ .Release.Namespace }}.svc.cluster.local,\
    repmgr-sts-1.repmgr-headless-svc.{{ .Release.Namespace }}.svc.cluster.local,\
    repmgr-sts-2.repmgr-headless-svc.{{ .Release.Namespace }}.svc.cluster.local
  PREFERRED_PRIMARY_CRON_SCHEDULE: "*/200 * * * *" # Every 20 mins
  PG_DUMP_CRON_SCHEDULE: "0 */2 * * *" # Every 2AM
---
apiVersion: v1
kind: Secret
metadata:
  name: repmgr-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # POSTGRES
  POSTGRES_USER: {{ .Values.secrets.POSTGRES_USER | quote }}
  PGUSER: {{ .Values.secrets.PGUSER | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  POSTGRES_DB: {{ .Values.secrets.POSTGRES_DB | quote }}
  # PGPOOL
  PGPOOL_USER: {{ .Values.secrets.PGPOOL_USER | quote }}
  PGPOOL_PASSWORD: {{ .Values.secrets.PGPOOL_PASSWORD | quote }}
  # REPMGR
  REPMGR_USER: {{ .Values.secrets.REPMGR_USER | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: repmgr-headless-svc
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app: repmgr-app
