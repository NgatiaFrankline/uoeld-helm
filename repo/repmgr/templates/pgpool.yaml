apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgpool-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: pgpool-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgpool-app
  template:
    metadata:
      labels:
        app: pgpool-app
    spec:
{{ include "x.image.pull.secrets.manifest" . | indent 6 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node1 }}
                      - {{ .Values.nodeSelectors.node2 }}
                      - {{ .Values.nodeSelectors.node3 }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node1 }}
            - weight: 30
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node2 }}
            - weight: 20
              preference:
                matchExpressions:
                  - key: {{ .Values.nodeSelectors.selectorKey }}
                    operator: In
                    values:
                      - {{ .Values.nodeSelectors.node3 }}
                      # pods with the label app:repmgr-app should not be co-located on the same node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - pgpool-app
              topologyKey: "kubernetes.io/hostname"  # One pod per node
      containers:
        - name: pgpool
          image: {{ .Values.image.pgpool }}
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          ports:
            - name: pgpool
              containerPort: 9999
              protocol: TCP
            - name: mgt
              containerPort: 9898
              protocol: TCP
          env:
            - name: BUILD_ENV
              value: "kubernetes"
            - name: PGHBA_HOST_ADDRESS
              value: {{ .Values.postgres_PGHBA_HOST_ADDRESS | quote }}
            - name: PGDATA
              value: "/var/lib/postgresql/data"
            - name: PGPOOL_CONF_DIR
              value: "/etc/pgpool2"
            - name: PGPOOL_NODE_NAME
              value: "pgpool-deploy"
          envFrom:
            - secretRef:
                name: pgpool-secrets
            - configMapRef:
                name: pgpool-config
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pgrep pgpool >/dev/null || exit 1
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pgrep pgpool >/dev/null || exit 1
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 120  # Matches your retries: 120
---
apiVersion: v1
kind: Secret
metadata:
  name: pgpool-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # PostgreSQL credentials
  POSTGRES_USER: {{ .Values.secrets.POSTGRES_USER | quote }}
  PGUSER: {{ .Values.secrets.PGUSER | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  POSTGRES_DB: {{ .Values.secrets.POSTGRES_DB | quote }}
  # Pgpool credentials
  PGPOOL_USER: {{ .Values.secrets.PGPOOL_USER | quote }}
  PGPOOL_PASSWORD: {{ .Values.secrets.PGPOOL_PASSWORD | quote }}
  PGPOOL_USERS: {{ .Values.secrets.PGPOOL_USERS | quote }}
  # Replication manager credentials
  REPMGR_USER: {{ .Values.secrets.REPMGR_USER | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgpool-config
  namespace: {{ .Release.Namespace }}
data:
  BUILD_ENV: "K8S"
  REPMGR_PARTNER_NODES: >-
    repmgr-sts-0.repmgr-headless-svc.{{ .Release.Namespace }}.svc.cluster.local,
    repmgr-sts-1.repmgr-headless-svc.{{ .Release.Namespace }}.svc.cluster.local,
    repmgr-sts-2.repmgr-headless-svc.{{ .Release.Namespace }}.svc.cluster.local
  PGPOOL_CONF_DIR: "/etc/pgpool2"
  PG_POOL_PORT: "9999"
  PG_POOL_DEBUG: "false"
  CRON_ATTACH_FAILED_NODES_SCHEDULE: "*/5 * * * *" # Every 5 mins
---
apiVersion: v1
kind: Service
metadata:
  name: pgpool-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP  # Change to NodePort or LoadBalancer if external access needed
  ports:
    - name: pgpool
      port: 9999
      targetPort: pgpool
      protocol: TCP
  selector:
    app: pgpool-app
---
apiVersion: v1
kind: Service
metadata:
  name: pgpool-nodeport-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort  # Change to NodePort or LoadBalancer if external access needed
  ports:
    - name: pgpool
      port: 9999
      targetPort: pgpool
      protocol: TCP
      nodePort: 30999
  selector:
    app: pgpool-app
