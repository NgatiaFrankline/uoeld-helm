image:
  repmgr: docker.io/uoewebmaster/uoeerp:repmgr-v17
  pgpool: docker.io/uoewebmaster/uoeerp:pgpool-v17
addImagePullSecretsManifest: true
nodeSelectors:
  selectorKey: database
  node1: pg-node-1
  node2: pg-node-2
  node3: pg-node-3
postgres_PGHBA_HOST_ADDRESS: 0.0.0.0/0
secrets:
  # PostgreSQL credentials
  POSTGRES_USER: "postgres"
  PGUSER: "postgres"
  POSTGRES_PASSWORD: "3xample"
  POSTGRES_DB: "postgres"

  # Pgpool credentials
  PGPOOL_USER: "pooluser"
  PGPOOL_PASSWORD: "s3cr3t"
  PGPOOL_USERS: "pooluser:s3cr3t,dngatia:david3144,postgres:3xample"

  # Replication manager credentials
  REPMGR_USER: "repuser"
volumes:
  repmgrHostStoragePath: "/repmgr"
  repmgrHostBackupPath: "/repmgr-backup"