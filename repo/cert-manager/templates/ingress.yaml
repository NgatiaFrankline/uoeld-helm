apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Namespace }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.org/client-max-body-size: 254m
    nginx.org/proxy-read-timeout: "3600"
    nginx.org/proxy-send-timeout: "3600"
    nginx.org/websocket-services: ingress-svc
    cert-manager.io/issuer: "{{ .Release.Namespace }}-tls-issuer"
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backendService }}
                port:
                  number: {{ .Values.backendPort }}
  tls:
    - hosts:
        - {{ .Values.host }}
      secretName: {{ .Values.host }}-tls