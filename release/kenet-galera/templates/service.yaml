apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Namespace }}-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: galeracluster
  ports:
    - name: galera
      port: 3306
      targetPort: mysql
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Namespace }}-nodeport-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: galeracluster
  type: NodePort
  ports:
    - name: galera-nodeport
      port: 3306
      targetPort: mysql
      protocol: TCP
      nodePort: 30006
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Namespace }}-headless-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
    - name: replication
      port: 4567
      protocol: TCP
    - name: state-transfer
      port: 4568
      protocol: TCP
  selector:
    app: galeracluster
