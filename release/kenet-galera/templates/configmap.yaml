apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-config
  namespace: {{ .Release.Namespace }}
data:
  CHARACTER_SET: |
    #
    # MariaDB configuration
    #
    [mysqld]

    # Transaction and InnoDB settings
    transaction_isolation = READ-COMMITTED
    innodb_lock_wait_timeout = 180
    innodb_rollback_on_timeout = 1
    log_bin_trust_function_creators = 1

    # Character set configuration for Frappe
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci
    skip-character-set-client-handshake

    # Temporary fix for MariaDB 10.6+
    skip-innodb-read-only-compressed

    # Time zone
    default-time-zone = +03:00

    # InnoDB tuning
    innodb-buffer-pool-size = 2G
    innodb-log-file-size = 512M
    max_allowed_packet = 64M
  GALERA_CONF: |
    #
    # Galera configuration
    #
    [mysqld]

    #
    # CUSTOM CONFIGURATIONS FOR REPLICATION
    # Mandatory settings
    wsrep_on                  = ON
    default_storage_engine    = InnoDB
    binlog_format             = row
    innodb_autoinc_lock_mode  = 2

    # Allow server to accept connections on all interfaces.
    bind-address  = 0.0.0.0

    # Galera cluster configuration
    wsrep_provider                  = /usr/lib/galera/libgalera_smm.so
    wsrep_cluster_address           = "gcomm://$GALERA_NODES_HOSTS"
    wsrep_cluster_name              = "Galera Cluster"
    wsrep_sst_method                = rsync
    innodb_flush_log_at_trx_commit  = 2

    # Cluster node configuration
    wsrep_node_address    = "$THIS_NODE_IP"
    wsrep_node_name       = "$THIS_GALERA_CLUSTER_NODE_NAME"

    # Galera causal reads: force all sessions to wait for pending writesets before
    # serving a SELECT, preventing read-after-write split-brain on reader nodes.
    wsrep_sync_wait = 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxysql-config
  namespace: {{ .Release.Namespace }}
data:
  PROXYSQL_CNF: |
    datadir="/var/lib/proxysql"
    admin_variables =
    {
      admin_credentials="${ADMIN_USER}:${ADMIN_PASSWORD}"
      mysql_ifaces="0.0.0.0:6032"
    }

    mysql_variables =
    {
      threads=4
      max_connections=2048
      default_query_delay=0
      default_query_timeout=36000000
      have_compress=true
      poll_timeout=2000
      interfaces="0.0.0.0:6033"
      default_schema="information_schema"
      stacksize=1048576
      server_version="${MARIADB_SERVER_VERSION}"
      connect_timeout_server=30000
      monitor_username="${MONITOR_USER}"
      monitor_password="${MONITOR_PASSWORD}"
      monitor_history=600000
      monitor_connect_interval=60000
      monitor_ping_interval=10000
      monitor_read_only_interval=1500
      monitor_read_only_timeout=500
      ping_interval_server_msec=3000
      ping_timeout_server=500
      commands_stats=true
      sessions_sort=true
      connect_retries_on_failure=10
    }

    # DYNAMIC INSERT MYSQL_SERVERS
    __MYSQL_SERVERS__

    # DYNAMIC INSERT MYSQL_USERS
    __MYSQL_USERS__

    # Query routing rules (write vs read)
    mysql_query_rules =
    (
      # Locking reads must always go to the writer
      { rule_id=1, active=1, match_pattern="^SELECT .* FOR UPDATE", destination_hostgroup=10, apply=1 },
      { rule_id=2, active=1, match_pattern="^SELECT .* LOCK IN SHARE MODE", destination_hostgroup=10, apply=1 },
      # information_schema queries must go to the writer — readers serve it from an
      # in-memory table cache that can lag behind DDL writesets even with wsrep_sync_wait=1,
      # causing false "table doesn't exist" results and duplicate CREATE TABLE errors.
      { rule_id=3, active=1, match_pattern="(?i)information_schema", destination_hostgroup=10, apply=1 },
      # Route plain SELECTs to readers
      { rule_id=4, active=1, match_pattern="^SELECT .*", destination_hostgroup=20, apply=1 },
      # Route everything else to writer
      { rule_id=5, active=1, match_pattern=".*", destination_hostgroup=10, apply=1 }
    )

    # Galera cluster monitoring — uses wsrep_local_state (not read_only)
    # HG 10 = active writer(s), HG 20 = readers, HG 30 = backup writers, HG 9999 = offline
    mysql_galera_hostgroups =
    (
      {
        writer_hostgroup=10,
        backup_writer_hostgroup=30,
        reader_hostgroup=20,
        offline_hostgroup=9999,
        active=1,
        max_writers=1,
        writer_is_also_reader=2,
        max_transactions_behind=300,
        comment="Galera Cluster"
      }
    )
