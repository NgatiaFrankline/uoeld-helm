apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxysql-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: galera-proxysql-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: galera-proxysql-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: galera-proxysql-app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: database
                    operator: In
                    values:
                      - node-1
                      - node-2
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: database
                    operator: In
                    values:
                      - node-1
            - weight: 50
              preference:
                matchExpressions:
                  - key: database
                    operator: In
                    values:
                      - node-2
        # pods with the label app:galeracluster should not be co-located on the same node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - galera-proxysql-app
              topologyKey: "kubernetes.io/hostname"  # One pod per node
      containers:
        - name: proxysql
          image: {{ .Values.image.proxysql }}
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: galera-proxysql-config
            - secretRef:
                name: galera-proxysql-secret
          ports:
            - name: client
              containerPort: 6033
              protocol: TCP
            - name: admin
              containerPort: 6032
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - mysql -h127.0.0.1 -P6032 -u${ADMIN_USER} -p${ADMIN_PASSWORD} -e 'SELECT 1' 2>/dev/null || exit 1
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - mysql -h127.0.0.1 -P6032 -u${ADMIN_USER} -p${ADMIN_PASSWORD} -e 'SELECT 1' 2>/dev/null || exit 1
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: proxysql-config
              mountPath: /conf/proxysql.cnf.template
              subPath: proxysql.cnf.template
      volumes:
        - name: proxysql-config
          configMap:
            name: proxysql-config
            items:
              - key: PROXYSQL_CNF
                path: proxysql.cnf.template
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: galera-proxysql-config
  namespace: {{ .Release.Namespace }}
data:
  SQL_SERVERS: >-
    {{ .Release.Namespace }}-sts-0.{{ .Release.Namespace }}-headless-svc.{{ .Release.Namespace }}.svc.cluster.local:3306:rw,
    {{ .Release.Namespace }}-sts-1.{{ .Release.Namespace }}-headless-svc.{{ .Release.Namespace }}.svc.cluster.local:3306:r,
---
apiVersion: v1
kind: Secret
metadata:
  name: galera-proxysql-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "upom3MoJ3hxGCthj"
  MARIADB_ROOT_PASSWORD: "upom3MoJ3hxGCthj"
  MARIADB_PASSWORD: "KxFgCBBEaS2B0Ugu"
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "admin@123"
  MONITOR_USER: "root"
  MONITOR_PASSWORD: "upom3MoJ3hxGCthj"
  MARIADB_SERVER_VERSION: "11.0.2-MariaDB-ubu2204"
  SQL_USERS: "root:upom3MoJ3hxGCthj,fngatia:KxFgCBBEaS2B0Ugu,endowment_user:UxFgCBBEaS2B0Ugx"
---
apiVersion: v1
kind: Service
metadata:
  name: galera-proxysql-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: galera-proxysql-app
spec:
  selector:
    app: galera-proxysql-app
  type: ClusterIP
  ports:
    - name: client
      port: 6033
      targetPort: client
      protocol: TCP
    - name: admin
      port: 6032
      targetPort: admin
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: galera-proxysql-nodeport
  namespace: {{ .Release.Namespace }}
  labels:
    app: galera-proxysql-app
spec:
  selector:
    app: galera-proxysql-app
  type: NodePort
  ports:
    - name: client
      port: 6033
      targetPort: client
      nodePort: 30633  # must be between 30000–32767
      protocol: TCP
    - name: admin
      port: 6032
      targetPort: admin
      nodePort: 30632 # must be between 30000–32767
      protocol: TCP
