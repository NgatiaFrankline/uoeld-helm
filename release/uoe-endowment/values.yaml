wordpress:
  config:
    ENV: "prod"
    WORDPRESS_DEBUG: "false"
    WORDPRESS_CACHE: "true"
    BACKUP_CRON_SCHEDULE: "*/25 * * * *"
    SITE_URL: "https://uoe-endowment.uoeld.ac.ke"
    DOMAIN: "uoe-endowment.uoeld.ac.ke"
    WORDPRESS_DB_HOST_AND_PORT: "galera-proxysql-svc.kenet-galera.svc.cluster.local:6033"
    WORDPRESS_DB_PORT: "6033"
    WORDPRESS_DB_NAME: "uoe_endowment"
    WORDPRESS_DB_USER: "endowment_user"
    WORDPRESS_DB_PASSWORD: "UxFgCBBEaS2B0Ugx"
    WORDPRESS_SERVICE_NODEPORT: "30018"
rsync:
  nodeSelector:
    enabled: true
    selector:
      key: "sitehost"
      value: "uoeldwebsite"
  containerVolume:
    mountPath: /data
    hostPath: /wordpress/uoe-endowment
    hostPathType: Directory
  rsyncRemote:
    RSYNC_REMOTE_USER: "dngatia"
    RSYNC_REMOTE_HOST_ADDRESS: "197.136.12.72"
    RSYNC_REMOTE_HOST_PORT: "1272"
    RSYNC_REMOTE_DIR: "/mnt/UOE-File-System-NFS-01/uoe-endowment/"
    RSYNC_LOCAL_DIR: "/data/"
    RSYNC_LOG_FILE: "/logs/rsync.log"
    RSYNC_CRON_TIME: "0 */6 * * *"
ingress:
  hosts:
    - ingressName: wordpress-ingress
      issuerPrefix: wordpress-tls
      backendService: wordpress-svc
      backendPort: 80
      domain: uoe-endowment.uoeld.ac.ke
  acme:
    staging: false
    email: fngatia@uoeld.ac.ke
    stagingServer: https://acme-staging-v02.api.letsencrypt.org/directory
    liveServer: https://acme-v02.api.letsencrypt.org/directory
