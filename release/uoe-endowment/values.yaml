wordpress:
  image:
    drupal: docker.io/ngatiafrankline/wordpress:wordpress
    nginx: docker.io/ngatiafrankline/wordpress:nginx
    redis: docker.io/ngatiafrankline/wordpress:redis
rsync:
  nodeSelector:
    enabled: true
    selector:
      key: "sitehost"
      value: "uoeldwebsite"
  containerVolume:
    mountPath: /data
    hostPath: /wordpress/uoe-endowment
    hostPathType: Directory
  rsyncRemote:
    RSYNC_REMOTE_USER: "dngatia"
    RSYNC_REMOTE_HOST_ADDRESS: "197.136.12.72"
    RSYNC_REMOTE_HOST_PORT: "1272"
    RSYNC_REMOTE_DIR: "/mnt/UOE-File-System-NFS-01/uoe-endowment/"
    RSYNC_LOCAL_DIR: "/data/"
    RSYNC_LOG_FILE: "/logs/rsync.log"
    RSYNC_CRON_TIME: "0 */6 * * *"
ingress:
  hosts:
    - ingressName: uoeld-ingress
      issuerPrefix: uoeld-tls
      backendService: uoeld-svc
      backendPort: 80
      domain: uoeld.ac.ke
    - ingressName: www-uoeld-ingress
      issuerPrefix: www-uoeld-tls
      backendService: uoeld-svc
      backendPort: 80
      domain: www.uoeld.ac.ke
  acme:
    staging: false
    email: fngatia@uoeld.ac.ke
    stagingServer: https://acme-staging-v02.api.letsencrypt.org/directory
    liveServer: https://acme-v02.api.letsencrypt.org/directory
