apiVersion: v1
kind: Service
metadata:
  name: uoeld-nodeport-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: drupal-http
      protocol: TCP
      nodePort: 30095
  selector:
    app: uoeld-drupal
---
apiVersion: v1
kind: Service
metadata:
  name: uoeld-svc
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: web-http
      port: 80
      targetPort: drupal-http
      protocol: TCP
  selector:
    app: uoeld-drupal
