apiVersion: apps/v1
kind: Deployment
metadata:
  name: uoeld-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: uoeld-drupal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uoeld-drupal
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: uoeld-drupal
    spec:
      nodeSelector:
        sitehost: uoeldwebsite # this pod must be assigned here because we will use the hostpath drive
      containers:
        - name: drupal-php
          image: {{ .Values.image.drupal }}
          imagePullPolicy: Always
          volumeMounts:
            - name: uoeld-drupal-drive
              mountPath: /var/www/drupal
            - name: php-fpm-socket
              mountPath: /var/run/php
            - name: redis-socket
              mountPath: /var/run/redis
          envFrom:
            - configMapRef:
                name: uoeld-drupal-config
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - /edesk/docker-healthcheck.sh
            failureThreshold: 8
            initialDelaySeconds: 120
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 60
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - /edesk/docker-healthcheck.sh
            failureThreshold: 4
            initialDelaySeconds: 100
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 60
        - name: redis
          image: {{ .Values.image.redis }}
          imagePullPolicy: Always
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          volumeMounts:
            - name: redis-socket
              mountPath: /var/run/redis
          env:
            - name: BUILD_ENV
              value: "k8s"
            - name: ALLOW_EMPTY_PASSWORD
              value: "yes"
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - redis-cli -s /var/run/redis/redis.sock ping || exit 1
            failureThreshold: 3
            initialDelaySeconds: 60
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 60
        - name: nginx
          image: {{ .Values.image.nginx }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: drupal-http
              protocol: TCP
          volumeMounts:
            - name: php-fpm-socket
              mountPath: /var/run/php
            - name: redis-socket
              mountPath: /var/run/redis
            - name: uoeld-drupal-drive
              mountPath: /var/www/drupal
          env:
            - name: BUILD_ENV
              value: "k8s"
            - name: APP_WEBSERVER_ROOT_DIR
              value: "/var/www/drupal/web"
      restartPolicy: Always
      volumes:
        - name: uoeld-drupal-drive
          hostPath:
            path: /drupal/uoeld # make sure it stays on the same host
            type: DirectoryOrCreate
        - name: php-fpm-socket
          emptyDir: {}
        - name: redis-socket
          emptyDir: {}
