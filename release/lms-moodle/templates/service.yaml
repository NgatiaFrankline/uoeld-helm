apiVersion: v1
kind: Service
metadata:
  name: moodle-webserver-nodeport-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: moodle-webserver
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 32100
