apiVersion: v1
kind: ConfigMap
metadata:
  name: moodle-config
  namespace: {{ .Release.Namespace }}
data:
  BUILD_ENV: "k8s"
  ENV: "prod"
  ENABLE_PHP_XDEBUG: "false"
  # SESSION REDIS
  ENABLE_SESSION_REDIS: {{ .Values.enable_session_redis | quote }}
  SESSION_REDIS_HOST: "redis-queue-headless-svc.{{ .Release.Namespace }}.svc.cluster.local"
  SESSION_REDIS_PORT: {{ .Values.redis.queue.port | quote }}
  SESSION_REDIS_AUTH: {{ .Values.redis.queue.password | quote }}
  # DATABASE
  DATABASE_HOST: "repmgr-sts-0.repmgr-headless-svc.repmgr.svc.cluster.local"
  DATABASE_PORT: "6432"
  DATABASE_NAME: "uoemoodleproddb"
  DATABASE_USER: "moodleprod"
  DATABASE_PASS: "H3qlJex73RXxS8u5g4oU"
  READ_ONLY_HOSTS: "repmgr-sts-1.repmgr-headless-svc.repmgr.svc.cluster.local" # moodle uses only one at a time
  # MOODLE
  HOT_RELOAD_ADDRESS: ""
  ENABLE_REVERSE_PROXY: "no"
  ENABLE_SSL_PROXY: "yes"
  DEV_ADDRESS: "http://ecampus.uoeld.ac.ke:32100"
  PROD_ADDRESS: "https://ecampus.uoeld.ac.ke"
  SCRIPTS_DIR: "/scripts"
  CONFIG_DIR: "/config"
  APP_ROOT_DIR: "/var/www"
  MOODLE_VERSION: "MOODLE_501_STABLE"
  MOODLE_ABSOLUTE_DIR: "/var/www/moodle"
  MOODLE_ABSOLUTE_WEB_DIR: "/var/www/moodle/public"
  MOODLE_ABSOLUTE_THEME_DIR: "/var/www/theme"
  MOODLE_ABSOLUTE_PLUGIN_DIR: "/var/www/moodle/public"
  MOODLE_DATAROOT: "/moodledata/"
  MOODLE_CACHEDIR: "/moodlecache/"
  MOODLE_TEMPDIR: "/moodletemp/"
  MOODLE_BACKUPTEMPDIR: "/moodlebackuptemp/"
  MOODLE_LOCALCACHEDIR: "/var/local/cache/"
  MOODLE_LOCALREQUESTDIR: "/tmp/"
  MOODLE_FILEDIR: "/moodledata/filedir/"
  MOODLE_PLUGINS_SYMLINKS: "local/ecampuspages,local/userprofiletable,message/output/notificationapi"
  MOODLE_NOTIFICATION_API_URL: "http://host.docker.internal:8091/api/moodle/queue/send"
  MOODLE_NOTIFICATION_API_KEY: "G7@mQ2#hL8&zW3!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-moodle-config
  namespace: {{ .Release.Namespace }}
data:
  BUILD_ENV: "K8S"
  ENV: "prod"
  NGINX_PORT: "80"
  MOODLE_WEBSERVER_ROOT_DIR: "/var/www/moodle/public"
  MOODLE_DATAROOT: "/moodledata/"
  MOODLE_CACHEDIR: "/moodlecache/"
  MOODLE_TEMPDIR: "/moodletemp/"
  MOODLE_LOCALCACHEDIR: "/var/local/cache/"
  MOODLE_LOCALREQUESTDIR: "/tmp/"
  MOODLE_FILEDIR: "/moodledata/filedir/"
  MOODLE_BACKUPTEMPDIR: "/moodlebackuptemp/"
  ALLOWED_DOMAINS: "*"
