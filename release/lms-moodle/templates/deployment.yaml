apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle-webserver-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: moodle-webserver
spec:
  replicas: 3
  selector:
    matchLabels:
      app: moodle-webserver
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: moodle-webserver
    spec:
      nodeSelector:
        {{ .Values.nodeSelector.selectorKey }}: {{ .Values.nodeSelector.selectorValue }}
      containers:
        - name: moodlephp
          image: {{ .Values.image.moodle }}
          imagePullPolicy: Always
          volumeMounts:
            - name: moodle-www
              mountPath: /var/www
            - name: moodle-data
              mountPath: /moodledata
            - name: localcache-dir
              mountPath: /var/local/cache
            - name: tmp-dir
              mountPath: /tmp
            - name: php-fpm-socket
              mountPath: /var/run/php
            - name: ssh-key
              mountPath: /root/.ssh
              readOnly: true
          envFrom:
            - configMapRef:
                name: moodle-config
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - /scripts/docker-healthcheck.sh
            failureThreshold: 4
            initialDelaySeconds: 100
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 60
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - /scripts/docker-healthcheck.sh
            failureThreshold: 4
            initialDelaySeconds: 100
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 60
        - name: moodlenginx
          image: {{ .Values.image.nginx }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          volumeMounts:
            - name: moodle-www
              mountPath: /var/www
            - name: moodle-data
              mountPath: /moodledata
            - name: localcache-dir
              mountPath: /var/local/cache
            - name: tmp-dir
              mountPath: /tmp
            - name: php-fpm-socket
              mountPath: /var/run/php
          envFrom:
            - configMapRef:
                name: nginx-moodle-config
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -f http://localhost/healthz || exit 1
            failureThreshold: 4
            initialDelaySeconds: 120
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -f http://localhost/healthz || exit 1
            failureThreshold: 4
            initialDelaySeconds: 120
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 60
      volumes:
        - name: moodle-www
          hostPath:
            path: /mnt/drive1/moodle/www
            type: Directory
        - name: moodle-data
          hostPath:
            path: /mnt/drive1/moodle/data
            type: Directory
        - name: localcache-dir
          emptyDir: {}
        - name: tmp-dir
          emptyDir: {}
        - name: php-fpm-socket
          emptyDir: {}
        - name: ssh-key
          secret:
            secretName: my-git-key-secret
            defaultMode: 0400
            items:
              - key: SSH_CONFIG
                path: config
              - key: MY_GIT_KEY
                path: my_git_key
              - key: MY_GIT_KEY_PUB
                path: my_git_key.pub
