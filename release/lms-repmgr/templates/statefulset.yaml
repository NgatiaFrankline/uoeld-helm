apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: repmgr-sts
  namespace: repmgr
  labels:
    app: repmgr
spec:
  serviceName: repmgr-headless-svc
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: repmgr
  template:
    metadata:
      labels:
        app: repmgr
    spec:
      #nodeSelector: # You cannot have the nodeSelector and nodeAffinity at the same time
      #  postgres: ready # This ensures pods only run on nodes with this label
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: repmgr
                    operator: In
                    values:
                      - node-1
          #                  - node-2
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: repmgr
                    operator: In
                    values:
                      - node-1
      #          - weight: 90
      #            preference:
      #              matchExpressions:
      #              - key: repmgr
      #                operator: In
      #                values:
      #                - node-2
      #        # pods with the label app:galeracluster should not be co-located on the same node
      #        podAntiAffinity:
      #          requiredDuringSchedulingIgnoredDuringExecution:
      #            - labelSelector:
      #                matchExpressions:
      #                  - key: app
      #                    operator: In
      #                    values:
      #                      - repmgr
      #              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: repmgr
          image: {{ .Values.image.repmgr }}
          imagePullPolicy: Always
          # Auxiliary vars to populate environment variables
          env:
            - name: BUILD_ENV
              value: "k8s"
            - name: ENV
              value: "prod"
            - name: AUTHOR
              value: "Ngatia Frankline"
            - name: PGHBA_HOST_ADDRESS
              value: "10.244.0.0/0"
            - name: POSTGRESQL_VOLUME_DIR_PREFIX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_ORDINAL_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['spec.pod.beta.kubernetes.io/statefulset-index']
            # POSTGRES
            - name: POSTGRES_USER
              value: "postgres"
            - name: PGUSER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "H3qlJex73RXxS8u5g4oU"
            - name: POSTGRES_DB
              value: "postgres"
            - name: PGDATA
              value: "/var/lib/postgresql/data"
            # PGPOOL
            - name: PGPOOL_USER
              value: "pgpool"
            - name: PGPOOL_PASSWORD
              value: "iy9kHO5+srPl5x2ZRUEU"
            - name: PGPOOL_CONF_DIR
              value: "/etc/pgpool2"
            # REPMGR
            - name: REPMGR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REPMGR_USER
              value: "repmgr"
            - name: REPMGR_NODE_NAME
              value: "$(MY_POD_NAME).repmgr-headless-svc.$(REPMGR_NAMESPACE).svc.cluster.local"
            - name: REPMGR_INIT_PRIMARY_HOST
              value: "repmgr-sts-0.repmgr-headless-svc.$(REPMGR_NAMESPACE).svc.cluster.local"
            - name: REPMGR_PARTNER_NODES
              value : "repmgr-sts-0.repmgr-headless-svc.repmgr,repmgr-sts-1.repmgr-headless-svc.repmgr"
            - name: REPMGR_RECONNECT_ATTEMPT
              value: "15"
            - name: REPMGR_RECONNECT_INTERVAL
              value: "180"
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - 'PGPASSWORD=$POSTGRES_PASSWORD psql -w -U "postgres" -d "postgres" -h 127.0.0.1 -c "SELECT 1"'
            initialDelaySeconds: 70
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - 'PGPASSWORD=$POSTGRES_PASSWORD psql -w -U "postgres" -d "postgres" -h 127.0.0.1 -c "SELECT 1"'
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
          volumeMounts:
            - name: hostpath-repmg-volume
              mountPath: /var/lib/postgresql/data
              subPathExpr: $(POSTGRESQL_VOLUME_DIR_PREFIX)
            - name: hostpath-repmgr-restore-volume
              mountPath: /restore
              subPathExpr: $(POSTGRESQL_VOLUME_DIR_PREFIX)
            - name: hostpath-repmgr-backup-volume
              mountPath: /backup
              subPathExpr: $(POSTGRESQL_VOLUME_DIR_PREFIX)
        - name: pgbouncer
          image: docker.io/ngatiafrankline/repmgr:pgbouncer1
          imagePullPolicy: Always
          # Auxiliary vars to populate environment variables
          env:
            - name: BUILD_ENV
              value: "k8s"
            - name: ENV
              value: "prod"
            - name: AUTHOR
              value: "Ngatia Frankline"
            - name: POSTGRES_USER
              value: "moodleprod"
            - name: POSTGRES_PASSWORD
              value: "H3qlJex73RXxS8u5g4oU"
            - name: POSTGRES_TARGET_DB
              value: "uoemoodleproddb"
            - name: POSTGRES_HOST
              value: "127.0.0.1"
            - name: POSTGRES_PORT
              value: "5432"
          ports:
            - name: pgbouncer
              containerPort: 6432
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 6432 -U postgres
            initialDelaySeconds: 70
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 6432 -U postgres
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
      restartPolicy: Always
      volumes:
        - name: hostpath-repmg-volume
          hostPath:
            path: /mnt/drive1/repmgr
            type: DirectoryOrCreate
        - name: hostpath-repmgr-restore-volume
          hostPath:
            path: /mnt/drive1/repmgr-restore
            type: DirectoryOrCreate
        - name: hostpath-repmgr-backup-volume
          hostPath:
            path: /mnt/drive1/repmgr-backup
            type: DirectoryOrCreate
