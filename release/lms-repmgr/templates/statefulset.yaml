apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: repmgr-sts
  namespace: repmgr
  labels:
    app: repmgr
spec:
  serviceName: repmgr-headless-svc
  replicas: 2
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: repmgr
  template:
    metadata:
      labels:
        app: repmgr
    spec:
      #nodeSelector: # You cannot have the nodeSelector and nodeAffinity at the same time
      #  postgres: ready # This ensures pods only run on nodes with this label
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: repmgr
                    operator: In
                    values:
                      - node-1
#                     - node-2
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: repmgr
                    operator: In
                    values:
                      - node-1
#          - weight: 90
#            preference:
#              matchExpressions:
#              - key: repmgr
#                operator: In
#                values:
#                - node-2
#        # pods with the label app:galeracluster should not be co-located on the same node
#        podAntiAffinity:
#          requiredDuringSchedulingIgnoredDuringExecution:
#            - labelSelector:
#                matchExpressions:
#                  - key: app
#                    operator: In
#                    values:
#                      - repmgr
#              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: repmgr
          image: {{ .Values.image.repmgr }}
          imagePullPolicy: Always
          # Auxiliary vars to populate environment variables
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POSTGRESQL_VOLUME_DIR_PREFIX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REPMGR_NODE_NAME
              value: "$(MY_POD_NAME).repmgr-headless-svc.$(NAMESPACE).svc.cluster.local"
            - name: REPMGR_INIT_PRIMARY_HOST
              value: "repmgr-sts-0.repmgr-headless-svc.$(NAMESPACE).svc.cluster.local"
          envFrom:
            - secretRef:
                name: repmgr-secret
            - configMapRef:
                name: repmgr-config
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /usr/bin/pg_isready
            initialDelaySeconds: 70
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /usr/bin/pg_isready
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
          volumeMounts:
            - name: hostpath-repmg-volume
              mountPath: /var/lib/postgresql/data
              subPathExpr: $(POSTGRESQL_VOLUME_DIR_PREFIX)
            - name: hostpath-repmgr-restore-volume
              mountPath: /restore
              subPathExpr: $(POSTGRESQL_VOLUME_DIR_PREFIX)
            - name: hostpath-repmgr-backup-volume
              mountPath: /backup
              subPathExpr: $(POSTGRESQL_VOLUME_DIR_PREFIX)
        - name: pgbouncer
          image: {{ .Values.image.pgbouncer }}
          imagePullPolicy: Always
          # Auxiliary vars to populate environment variables
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POOLS
              value: "$(MY_POD_NAME).repmgr-headless-svc.$(NAMESPACE).svc.cluster.local:5432:$(MOODLE_POSTGRES_USER):$(POSTGRES_PASSWORD):$(MOODLE_POSTGRES_DB)"
          envFrom:
            - secretRef:
                name: repmgr-secret
            - configMapRef:
                name: repmgr-config
          ports:
            - name: pgbouncer
              containerPort: 6432
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - exec 3<>/dev/tcp/127.0.0.1/6432
            initialDelaySeconds: 70
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - exec 3<>/dev/tcp/127.0.0.1/6432
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
      restartPolicy: Always
      volumes:
        - name: hostpath-repmg-volume
          hostPath:
            path: /mnt/drive1/repmgr
            type: DirectoryOrCreate
        - name: hostpath-repmgr-restore-volume
          hostPath:
            path: /mnt/drive1/repmgr-restore
            type: DirectoryOrCreate
        - name: hostpath-repmgr-backup-volume
          hostPath:
            path: /mnt/drive1/repmgr-backup
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Secret
metadata:
  name: repmgr-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # POSTGRES
  POSTGRES_USER: {{ .Values.secrets.POSTGRES_USER | quote }}
  PGUSER: {{ .Values.secrets.PGUSER | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  POSTGRES_DB: {{ .Values.secrets.POSTGRES_DB | quote }}
  SHELL_USER: {{ .Values.secrets.SHELL_USER | quote }}
  SHELL_USER_PASSWORD: {{ .Values.secrets.SHELL_USER_PASSWORD | quote }}
  SHELL_USER_DB: {{ .Values.secrets.SHELL_USER_DB | quote }}
  # REPMGR
  REPMGR_USER: {{ .Values.secrets.REPMGR_USER | quote }}
  # PGPOOL
  PGPOOL_USER: {{ .Values.secrets.PGPOOL_USER | quote }}
  PGPOOL_PASSWORD: {{ .Values.secrets.PGPOOL_PASSWORD | quote }}
  # PGBOUNCER ENV
  MOODLE_POSTGRES_USER: {{ .Values.secrets.MOODLE_POSTGRES_USER | quote }}
  MOODLE_POSTGRES_PASSWORD: {{ .Values.secrets.MOODLE_POSTGRES_PASSWORD | quote }}
  MOODLE_POSTGRES_DB: {{ .Values.secrets.MOODLE_POSTGRES_DB | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repmgr-config
  namespace: {{ .Release.Namespace }}
data:
  BUILD_ENV: "K8S"
  ENV: "prod"
  AUTHOR: "Ngatia Frankline"
  PGDATA: "/var/lib/postgresql/data"
  REPMGR_PARTNER_NODES: >-
    repmgr-sts-0.repmgr-headless-svc.{{ .Release.Namespace }}.svc.cluster.local,
    repmgr-sts-1.repmgr-headless-svc.{{ .Release.Namespace }}.svc.cluster.local
  REPMGR_RECONNECT_ATTEMPT: "20" # 20 times
  REPMGR_RECONNECT_INTERVAL: "180" # 3 minutes
  PREFERRED_PRIMARY_CRON_SCHEDULE: "*/15 * * * *"
  PG_DUMP_CRON_SCHEDULE: "0 */2 * * *" # Every 2AM
  PGHBA_HOST_ADDRESS: {{ .Values.postgres_PGHBA_HOST_ADDRESS | quote }}
  REPMGR_ALLOW_PRIMARY_START_WITHOUT_PARTNERS: "false"
  REPMGR_PRIMARY_WAITING_FOR_PARTNERS_TIMEOUT: "200" # this value is derived from probe wait time before start
