# RBAC bindings that map Keycloak groups to Kubernetes roles.
#
# How it works:
#   1. Keycloak sends a "groups" claim in the OIDC token (e.g. ["/k8s-admins"])
#   2. The K8s API server must be started with:
#        --oidc-issuer-url=https://sso.uoeld.ac.ke/realms/uoe
#        --oidc-client-id=uoeld-headlamp
#        --oidc-username-claim=email
#        --oidc-groups-claim=groups
#        --oidc-groups-prefix=
#   3. ClusterRoleBindings grant cluster-wide access.
#      RoleBindings grant access restricted to a specific namespace.
#
# Keycloak setup:
#   - Realm > Clients > uoeld-headlamp > Client Scopes > add "groups" scope
#   - Create groups: k8s-admins, k8s-editors, k8s-viewers, erp-viewers, finance-editors
#   - Assign users to groups via their email account

rbac:
  # Custom ClusterRoles to supplement built-in roles
  customClusterRoles:
    # Allows any authenticated user to read node/pod metrics from metrics-server.
    # The built-in 'view' role does not cover metrics.k8s.io, so Headlamp's
    # node/pod metrics panels show Forbidden for non-admin users without this.
    - name: metrics-viewer
      labels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"  #Inherits view permissions
      rules:
        - apiGroups: ["metrics.k8s.io"]
          resources: ["nodes", "pods"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list", "watch"]

