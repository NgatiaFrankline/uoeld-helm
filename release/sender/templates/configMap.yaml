apiVersion: v1
kind: ConfigMap
metadata:
  name: sender-config
  namespace: {{ .Release.Namespace }}
data:
  BUILD_ENV: "k8s"
  ENV: "prod"
  SERVER_PORT: "8091"
  TZ: "Africa/Nairobi"
  JAVA_OPTS: "-Xmx512m -Xms256m -Duser.timezone=Africa/Nairobi"
  APP_ROOT_DIR: "/app"
  PROD_JAR_FILE: {{ .Values.PROD_JAR_FILE | quote }}
  RABBITMQ_HOST_URL: "localhost"
  RABBITMQ_HOST_PORT: "5672"
  RABBITMQ_USERNAME: "admin"
  RABBITMQ_PASSWORD: "UoE1125%"
  CORS_ALLOWED_ORIGINS: "http://localhost:8091,http://localhost:5672,https://sender.uoeld.ac.ke:8091"
  # GIT CONFIGURATION
  GIT_SSH_REPO: "git@github.com:NgatiaFrankline/sender.git"
  GIT_SSH_BRANCH: "main"
  GIT_SSH_KEYS_NAME: "my_git_key"
  GIT_COPY: "app/dist/*:/app,tokens:/app/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: {{ .Release.Namespace }}
data:
  BUILD_ENV: "k8s"
  ENV: "prod"
  RABBITMQ_DEFAULT_USER: "admin"
  RABBITMQ_DEFAULT_PASS: "UoE1125%"
  RABBITMQ_ERLANG_COOKIE: "mysecretcookie"
